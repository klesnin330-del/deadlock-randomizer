<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadlock Hero Randomizer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Raleway:wght@300;400;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: #0a0a0f;
            color: #e0d8f0;
            font-family: 'Raleway', sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(88, 28, 135, .25) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(30, 58, 138, .2) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(127, 29, 83, .2) 0%, transparent 50%);
            animation: bgShift 12s ease-in-out infinite alternate;
        }

        @keyframes bgShift {
            0%   { opacity: .8; filter: hue-rotate(0deg); }
            100% { opacity: 1;  filter: hue-rotate(30deg); }
        }

        .particles {
            position: fixed; inset: 0; z-index: 0;
            overflow: hidden; pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 3px; height: 3px;
            background: rgba(168, 130, 255, .6);
            border-radius: 50%;
            animation: floatUp linear infinite;
            box-shadow: 0 0 6px rgba(168, 130, 255, .8);
        }

        @keyframes floatUp {
            0%   { transform: translateY(100vh) scale(0); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        .container {
            position: relative; z-index: 1;
            width: 90%; max-width: 700px;
            text-align: center;
        }

        .title {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.8rem, 5vw, 3rem);
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #a78bfa, #c084fc, #e879f9, #a78bfa);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s ease-in-out infinite;
            margin-bottom: 8px;
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50%      { background-position: 100% 50%; }
        }

        .subtitle {
            font-size: .95rem;
            color: rgba(196, 181, 253, .5);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        .selector-group {
            display: flex; align-items: center; justify-content: center;
            gap: 14px; margin-bottom: 36px; flex-wrap: wrap;
        }

        .selector-group label {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            color: rgba(196, 181, 253, .7);
            letter-spacing: 2px;
        }

        .count-btn {
            width: 48px; height: 48px;
            border: 2px solid rgba(139, 92, 246, .3);
            border-radius: 12px;
            background: rgba(88, 28, 135, .15);
            color: #c4b5fd;
            font-family: 'Cinzel', serif;
            font-size: 1.1rem; font-weight: 700;
            cursor: pointer;
            transition: all .25s ease;
            backdrop-filter: blur(6px);
        }

        .count-btn:hover {
            border-color: rgba(168, 130, 255, .6);
            background: rgba(88, 28, 135, .3);
            transform: scale(1.08);
        }

        .count-btn.active {
            border-color: #a78bfa;
            background: rgba(139, 92, 246, .35);
            box-shadow: 0 0 18px rgba(139, 92, 246, .4);
            color: #fff;
        }

        .slot-frame {
            position: relative;
            background: linear-gradient(145deg, rgba(30, 27, 56, .6), rgba(15, 12, 30, .8));
            border: 1px solid rgba(139, 92, 246, .25);
            border-radius: 20px;
            padding: 4px;
            margin-bottom: 36px;
            box-shadow: 0 0 40px rgba(88, 28, 135, .15),
                        inset 0 0 60px rgba(88, 28, 135, .05);
        }

        .slot-inner {
            border-radius: 17px;
            background: rgba(10, 10, 20, .9);
            overflow: hidden;
            position: relative;
        }

        .slot-inner::before,
        .slot-inner::after {
            content: '';
            position: absolute; left: 0; right: 0;
            height: 60px; z-index: 2; pointer-events: none;
        }

        .slot-inner::before {
            top: 0;
            background: linear-gradient(to bottom, rgba(10, 10, 20, 1), transparent);
        }

        .slot-inner::after {
            bottom: 0;
            background: linear-gradient(to top, rgba(10, 10, 20, 1), transparent);
        }

        .highlight-line {
            position: absolute;
            top: 50%; left: 0; right: 0;
            height: 56px;
            transform: translateY(-50%);
            border-top: 1px solid rgba(168, 130, 255, .25);
            border-bottom: 1px solid rgba(168, 130, 255, .25);
            background: rgba(139, 92, 246, .06);
            z-index: 3; pointer-events: none;
        }

        .slot-viewport {
            height: 280px;
            overflow: hidden;
            position: relative;
        }

        .slot-strip {
            display: flex;
            flex-direction: column;
            will-change: transform;
        }

        .slot-item {
            height: 56px;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Cinzel', serif;
            font-size: 1.15rem; font-weight: 700;
            letter-spacing: 2px;
            color: rgba(196, 181, 253, .35);
            text-transform: uppercase;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .slot-item.winner {
            color: #e9d5ff;
            text-shadow: 0 0 20px rgba(168, 130, 255, .8),
                         0 0 40px rgba(139, 92, 246, .4);
        }

        .generate-btn {
            position: relative;
            padding: 16px 60px;
            font-family: 'Cinzel', serif;
            font-size: 1.15rem; font-weight: 700;
            letter-spacing: 4px; text-transform: uppercase;
            color: #fff;
            background: linear-gradient(135deg, rgba(88, 28, 135, .7), rgba(127, 29, 83, .7));
            border: 1px solid rgba(168, 130, 255, .3);
            border-radius: 16px;
            cursor: pointer;
            transition: all .3s ease;
            overflow: hidden;
        }

        .generate-btn::before {
            content: '';
            position: absolute; inset: -2px;
            border-radius: 18px;
            background: linear-gradient(135deg, #a78bfa, #e879f9, #a78bfa);
            background-size: 400% 400%;
            z-index: -1; opacity: 0;
            transition: opacity .3s ease;
            animation: shimmer 3s ease-in-out infinite;
        }

        .generate-btn:hover::before { opacity: 1; }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(139, 92, 246, .4);
        }

        .generate-btn:active { transform: translateY(0); }

        .generate-btn:disabled {
            opacity: .5; cursor: not-allowed; transform: none;
        }

        .results { margin-top: 36px; min-height: 40px; }

        .result-cards {
            display: flex; flex-wrap: wrap;
            justify-content: center; gap: 14px;
        }

        .result-card {
            padding: 14px 28px;
            background: linear-gradient(135deg, rgba(88, 28, 135, .25), rgba(30, 27, 56, .4));
            border: 1px solid rgba(139, 92, 246, .3);
            border-radius: 14px;
            font-family: 'Cinzel', serif;
            font-size: 1.05rem; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase;
            color: #e9d5ff;
            animation: cardAppear .5s cubic-bezier(.22, 1, .36, 1) both;
            box-shadow: 0 4px 24px rgba(88, 28, 135, .2);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: scale(.8) translateY(10px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        .result-card .rarity-glow {
            display: block;
            margin-top: 6px;
            font-size: .7rem;
            letter-spacing: 4px;
            color: rgba(196, 181, 253, .4);
            font-weight: 400;
        }

        .footer {
            margin-top: 50px;
            font-size: .75rem;
            color: rgba(196, 181, 253, .2);
            letter-spacing: 3px;
        }

        @media (max-width: 500px) {
            .slot-viewport { height: 224px; }
            .slot-item { height: 56px; font-size: .95rem; }
            .count-btn { width: 42px; height: 42px; font-size: 1rem; }
        }
    </style>
</head>
<body>

<div class="bg-layer"></div>
<div class="particles" id="particles"></div>

<div class="container">
    <h1 class="title">Deadlock</h1>
    <p class="subtitle">Hero Randomizer</p>

    <div class="selector-group">
        <label>Heroes:</label>
        <button class="count-btn active" data-count="1">1</button>
        <button class="count-btn" data-count="2">2</button>
        <button class="count-btn" data-count="3">3</button>
        <button class="count-btn" data-count="4">4</button>
        <button class="count-btn" data-count="5">5</button>
    </div>

    <div class="slot-frame">
        <div class="slot-inner">
            <div class="highlight-line"></div>
            <div class="slot-viewport">
                <div class="slot-strip" id="slotStrip"></div>
            </div>
        </div>
    </div>

    <button class="generate-btn" id="generateBtn">⚡ Ролл ⚡</button>

    <div class="results" id="results"></div>

    <p class="footer">May the void decide your fate</p>
</div>

<script>
    const HEROES = [
        "Abrams","Apollo","Bebop","Billy","The Doorman","Drifter",
        "Dynamo","Grey Talon","Infernus","Kelvin","Lash","Mirage",
        "Mo & Krill","Rem","Seven","Shiv","Venator","Victor",
        "Viscous","Warden","Calico","Celeste","Graves","Haze",
        "Holliday","Ivy","Lady Geist","McGinnis","Mina","Paige",
        "Paradox","Silver","Vindicta","Vyper","Wraith","Yamato"
    ];

    const ITEM_HEIGHT = 56;
    let selectedCount = 1;
    let isSpinning = false;

    const stripEl = document.getElementById('slotStrip');
    const btnEl = document.getElementById('generateBtn');
    const resultsEl = document.getElementById('results');

    // ── Particles ──
    (function createParticles() {
        const container = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (4 + Math.random() * 8) + 's';
            p.style.animationDelay = (Math.random() * 8) + 's';
            p.style.width = p.style.height = (2 + Math.random() * 3) + 'px';
            container.appendChild(p);
        }
    })();

    // ── Count buttons ──
    document.querySelectorAll('.count-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            if (isSpinning) return;
            document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedCount = parseInt(btn.dataset.count);
        });
    });

    // ── Build strip ──
    function buildStrip(finalHeroes) {
        stripEl.innerHTML = '';
        stripEl.style.transition = 'none';
        stripEl.style.transform = 'translateY(0)';

        const padCount = 60;
        const items = [];

        for (let i = 0; i < padCount; i++) {
            items.push(HEROES[Math.floor(Math.random() * HEROES.length)]);
        }

        for (const h of finalHeroes) {
            items.push(h);
        }

        items.forEach(name => {
            const div = document.createElement('div');
            div.className = 'slot-item';
            div.textContent = name;
            stripEl.appendChild(div);
        });

        return items;
    }

    // ── Spin ──
    function spin() {
        if (isSpinning) return;
        isSpinning = true;
        btnEl.disabled = true;
        resultsEl.innerHTML = '';

        const winners = [];
        for (let i = 0; i < selectedCount; i++) {
            winners.push(HEROES[Math.floor(Math.random() * HEROES.length)]);
        }

        const items = buildStrip(winners);
        const totalItems = items.length;

        const viewportHeight = document.querySelector('.slot-viewport').offsetHeight;
        const centerOffset = viewportHeight / 2 - ITEM_HEIGHT / 2;
        const winnerIndex = totalItems - selectedCount;
        const targetY = -(winnerIndex * ITEM_HEIGHT) + centerOffset;

        void stripEl.offsetHeight;

        const duration = 2500;
        const startTime = performance.now();

        function easeOutCubic(t) {
            return 1 - Math.pow(1 - t, 3);
        }

        function animate(now) {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const eased = easeOutCubic(progress);
            const currentY = targetY * eased;
            stripEl.style.transform = `translateY(${currentY}px)`;

            if (progress < 1) {
                requestAnimationFrame(animate);
            } else {
                const itemEls = stripEl.querySelectorAll('.slot-item');
                for (let i = 0; i < selectedCount; i++) {
                    const idx = totalItems - selectedCount + i;
                    if (itemEls[idx]) itemEls[idx].classList.add('winner');
                }

                setTimeout(() => {
                    showResults(winners);
                    isSpinning = false;
                    btnEl.disabled = false;
                }, 300);
            }
        }

        requestAnimationFrame(animate);
    }

    function showResults(winners) {
        const container = document.createElement('div');
        container.className = 'result-cards';

        winners.forEach((hero, i) => {
            const card = document.createElement('div');
            card.className = 'result-card';
            card.style.animationDelay = `${i * 0.12}s`;
            card.innerHTML = `${hero}<span class="rarity-glow">✦ summoned ✦</span>`;
            container.appendChild(card);
        });

        resultsEl.appendChild(container);
    }

    btnEl.addEventListener('click', spin);

    document.addEventListener('keydown', e => {
        if (e.code === 'Space' || e.code === 'Enter') {
            e.preventDefault();
            spin();
        }
    });
</script>

</body>
</html>
