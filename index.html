<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadlock Hero Randomizer</title>
    <link rel="icon" href="image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Raleway:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: #0a0a0f;
            color: #e0d8f0;
            font-family: 'Raleway', sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }

        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(88, 28, 135, .25) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(30, 58, 138, .2) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(127, 29, 83, .2) 0%, transparent 50%);
            animation: bgShift 12s ease-in-out infinite alternate;
        }

        @keyframes bgShift {
            0%   { opacity: .8; filter: hue-rotate(0deg); }
            100% { opacity: 1;  filter: hue-rotate(30deg); }
        }

        .particles {
            position: fixed; inset: 0; z-index: 0;
            overflow: hidden; pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 3px; height: 3px;
            background: rgba(168, 130, 255, .6);
            border-radius: 50%;
            animation: floatUp linear infinite;
            box-shadow: 0 0 6px rgba(168, 130, 255, .8);
        }

        @keyframes floatUp {
            0%   { transform: translateY(100vh) scale(0); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        .container {
            position: relative; z-index: 1;
            width: 95%; max-width: 1200px; /* Увеличил ширину для 5 слотов в ряд */
            text-align: center;
        }

        .title {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.8rem, 5vw, 3rem);
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #a78bfa, #c084fc, #e879f9, #a78bfa);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s ease-in-out infinite;
            margin-bottom: 8px;
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50%      { background-position: 100% 50%; }
        }

        .subtitle {
            font-size: .95rem;
            color: rgba(196, 181, 253, .5);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .selector-group {
            display: flex; align-items: center; justify-content: center;
            gap: 14px; margin-bottom: 30px; flex-wrap: wrap;
        }

        .selector-group label {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            color: rgba(196, 181, 253, .7);
            letter-spacing: 2px;
        }

        .count-btn {
            width: 48px; height: 48px;
            border: 2px solid rgba(139, 92, 246, .3);
            border-radius: 12px;
            background: rgba(88, 28, 135, .15);
            color: #c4b5fd;
            font-family: 'Cinzel', serif;
            font-size: 1.1rem; font-weight: 700;
            cursor: pointer;
            transition: all .25s ease;
            backdrop-filter: blur(6px);
        }

        .count-btn:hover {
            border-color: rgba(168, 130, 255, .6);
            background: rgba(88, 28, 135, .3);
            transform: scale(1.08);
        }

        .count-btn.active {
            border-color: #a78bfa;
            background: rgba(139, 92, 246, .35);
            box-shadow: 0 0 18px rgba(139, 92, 246, .4);
            color: #fff;
        }

        /* ── СЕТКА ДЛЯ СЛОТОВ ── */
        .slots-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            align-items: stretch;
        }

        .slot-wrapper {
            /* Flexbox логика: базовая ширина 280px, но может растягиваться */
            flex: 1 1 280px;
            max-width: 350px; /* Не шире 350px, чтобы влезало по 3 в ряд */
            opacity: 0;
            transform: scale(0.9);
            animation: slotAppear 0.4s cubic-bezier(.22, 1, .36, 1) forwards;
        }

        @keyframes slotAppear {
            to { opacity: 1; transform: scale(1); }
        }

        .slot-frame {
            position: relative;
            background: linear-gradient(145deg, rgba(30, 27, 56, .6), rgba(15, 12, 30, .8));
            border: 1px solid rgba(139, 92, 246, .25);
            border-radius: 20px;
            padding: 4px;
            height: 100%; /* Растягиваем на всю высоту контейнера */
            box-shadow: 0 0 40px rgba(88, 28, 135, .15),
                        inset 0 0 60px rgba(88, 28, 135, .05);
        }

        .slot-inner {
            border-radius: 17px;
            background: rgba(10, 10, 20, .9);
            overflow: hidden;
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .slot-inner::before,
        .slot-inner::after {
            content: '';
            position: absolute; left: 0; right: 0;
            height: 60px; z-index: 2; pointer-events: none;
        }

        .slot-inner::before {
            top: 0;
            background: linear-gradient(to bottom, rgba(10, 10, 20, 1), transparent);
        }

        .slot-inner::after {
            bottom: 0;
            background: linear-gradient(to top, rgba(10, 10, 20, 1), transparent);
        }

        .highlight-line {
            position: absolute;
            top: 50%; left: 0; right: 0;
            height: 56px;
            transform: translateY(-50%);
            border-top: 1px solid rgba(168, 130, 255, .25);
            border-bottom: 1px solid rgba(168, 130, 255, .25);
            background: rgba(139, 92, 246, .06);
            z-index: 3; pointer-events: none;
        }

        .slot-viewport {
            height: 280px; /* Фиксированная высота прокрутки */
            overflow: hidden;
            position: relative;
            flex-grow: 1;
        }

        .slot-strip {
            display: flex;
            flex-direction: column;
            will-change: transform;
        }

        .slot-item {
            height: 56px;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Cinzel', serif;
            font-size: 1.15rem; font-weight: 700;
            letter-spacing: 2px;
            color: rgba(196, 181, 253, .35);
            text-transform: uppercase;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .slot-item.winner {
            color: #e9d5ff;
            text-shadow: 0 0 20px rgba(168, 130, 255, .8),
                         0 0 40px rgba(139, 92, 246, .4);
        }

        .generate-btn {
            position: relative;
            padding: 16px 60px;
            font-family: 'Cinzel', serif;
            font-size: 1.15rem; font-weight: 700;
            letter-spacing: 4px; text-transform: uppercase;
            color: #fff;
            background: linear-gradient(135deg, rgba(88, 28, 135, .7), rgba(127, 29, 83, .7));
            border: 1px solid rgba(168, 130, 255, .3);
            border-radius: 16px;
            cursor: pointer;
            transition: all .3s ease;
            overflow: hidden;
            margin-bottom: 40px;
        }

        .generate-btn::before {
            content: '';
            position: absolute; inset: -2px;
            border-radius: 18px;
            background: linear-gradient(135deg, #a78bfa, #e879f9, #a78bfa);
            background-size: 400% 400%;
            z-index: -1; opacity: 0;
            transition: opacity .3s ease;
            animation: shimmer 3s ease-in-out infinite;
        }

        .generate-btn:hover::before { opacity: 1; }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(139, 92, 246, .4);
        }

        .generate-btn:active { transform: translateY(0); }
        .generate-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

        .hero-display {
            margin-top: 20px;
            display: none;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding-bottom: 20px;
        }

        .hero-display.active { display: flex; }

        .hero-card {
            background: linear-gradient(145deg, rgba(30, 27, 56, .8), rgba(15, 12, 30, .9));
            border: 2px solid rgba(139, 92, 246, .4);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            animation: heroAppear 0.5s cubic-bezier(.22, 1, .36, 1) both;
            box-shadow: 0 8px 32px rgba(88, 28, 135, .3);
            /* Убрал min-width, чтобы карточки были фиксированного размера */
        }

        @keyframes heroAppear {
            from { opacity: 0; transform: scale(0.8) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* ── РАЗМЕРЫ ФОТО 160x217 ── */
        .hero-image-container {
            width: 160px;
            height: 217px;
            margin: 0 auto 12px auto;
            border-radius: 12px;
            border: 2px solid rgba(168, 130, 255, .3);
            overflow: hidden;
            background: rgba(0,0,0,0.3);
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .4);
        }

        .hero-image {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Заполняет блок, обрезая лишнее, но сохраняя пропорции */
            display: block;
        }
        
        .hero-image-placeholder {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            background: linear-gradient(135deg, rgba(30, 27, 56, .8), rgba(10, 10, 20, .9));
            color: rgba(196, 181, 253, .3);
            display: none;
        }

        .hero-name {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #e9d5ff;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .hero-rarity {
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: rgba(196, 181, 253, .5);
            text-transform: uppercase;
        }

        .footer {
            font-size: .75rem;
            color: rgba(196, 181, 253, .2);
            letter-spacing: 3px;
        }

        @media (max-width: 600px) {
            .slot-viewport { height: 224px; }
            .slot-item { height: 56px; font-size: .95rem; }
            .count-btn { width: 42px; height: 42px; font-size: 1rem; }
            .hero-image-container { width: 120px; height: 163px; } /* Чуть меньше на мобильных */
        }
    </style>
</head>
<body>

<div class="bg-layer"></div>
<div class="particles" id="particles"></div>

<div class="container">
    <h1 class="title">Deadlock</h1>
    <p class="subtitle">Hero Randomizer</p>

    <div class="selector-group">
        <label>Heroes:</label>
        <button class="count-btn active" data-count="1">1</button>
        <button class="count-btn" data-count="2">2</button>
        <button class="count-btn" data-count="3">3</button>
        <button class="count-btn" data-count="4">4</button>
        <button class="count-btn" data-count="5">5</button>
    </div>

    <div class="slots-container" id="slotsContainer"></div>

    <button class="generate-btn" id="generateBtn"> Ролл ⚡</button>

    <div class="hero-display" id="heroDisplay"></div>

    <p class="footer">May the void decide your fate</p>
</div>

<script>
    const HEROES = [
        "Abrams","Apollo","Bebop","Billy","The Doorman","Drifter",
        "Dynamo","Grey Talon","Infernus","Kelvin","Lash","Mirage",
        "Mo & Krill","Pocket","Rem","Seven","Shiv","Sinclair",
        "Venator","Victor","Viscous","Warden","Calico","Celeste",
        "Graves","Haze","Holliday","Ivy","Lady Geist","McGinnis",
        "Mina","Paige","Paradox","Silver","Vindicta","Vyper",
        "Wraith","Yamato"
    ];

    const HERO_FILENAMES = {
        "Abrams": "abrams",
        "Apollo": "apollo",
        "Bebop": "bebop",
        "Billy": "billy",
        "The Doorman": "the-doorman",
        "Drifter": "drifter",
        "Dynamo": "dynamo",
        "Grey Talon": "grey-talon",
        "Infernus": "infernus",
        "Kelvin": "kelvin",
        "Lash": "lash",
        "Mirage": "mirage",
        "Mo & Krill": "mo-and-krill",
        "Pocket": "pocket",
        "Rem": "rem",
        "Seven": "seven",
        "Shiv": "shiv",
        "Sinclair": "sinclair",
        "Venator": "venator",
        "Victor": "victor",
        "Viscous": "viscous",
        "Warden": "warden",
        "Calico": "calico",
        "Celeste": "celeste",
        "Graves": "graves",
        "Haze": "haze",
        "Holliday": "holliday",
        "Ivy": "ivy",
        "Lady Geist": "lady-geist",
        "McGinnis": "mcginnis",
        "Mina": "mina",
        "Paige": "paige",
        "Paradox": "paradox",
        "Silver": "silver",
        "Vindicta": "vindicta",
        "Vyper": "vyper",
        "Wraith": "wraith",
        "Yamato": "yamato"
    };

    const ITEM_HEIGHT = 56;
    let selectedCount = 1;
    let isSpinning = false;

    const slotsContainer = document.getElementById('slotsContainer');
    const btnEl = document.getElementById('generateBtn');
    const heroDisplay = document.getElementById('heroDisplay');

    // ── Частицы ──
    (function createParticles() {
        const container = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (4 + Math.random() * 8) + 's';
            p.style.animationDelay = (Math.random() * 8) + 's';
            p.style.width = p.style.height = (2 + Math.random() * 3) + 'px';
            container.appendChild(p);
        }
    })();

    // ── Кнопки выбора ──
    document.querySelectorAll('.count-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            if (isSpinning) return;
            document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedCount = parseInt(btn.dataset.count);
            createSlots(selectedCount);
        });
    });

    // ── Создание слотов ──
    function createSlots(count) {
        slotsContainer.innerHTML = '';
        heroDisplay.classList.remove('active');
        heroDisplay.innerHTML = '';

        for (let i = 0; i < count; i++) {
            const wrapper = document.createElement('div');
            wrapper.className = 'slot-wrapper';
            wrapper.style.animationDelay = `${i * 0.1}s`;
            wrapper.innerHTML = `
                <div class="slot-frame">
                    <div class="slot-inner">
                        <div class="highlight-line"></div>
                        <div class="slot-viewport">
                            <div class="slot-strip" id="strip-${i}"></div>
                        </div>
                    </div>
                </div>
            `;
            slotsContainer.appendChild(wrapper);
        }
    }

    // ── Заполнение ленты ──
    function buildStrip(stripId, finalHero) {
        const stripEl = document.getElementById(stripId);
        stripEl.innerHTML = '';
        stripEl.style.transition = 'none';
        stripEl.style.transform = 'translateY(0)';

        const padCount = 60;
        const items = [];

        for (let i = 0; i < padCount; i++) {
            items.push(HEROES[Math.floor(Math.random() * HEROES.length)]);
        }
        items.push(finalHero);

        items.forEach(name => {
            const div = document.createElement('div');
            div.className = 'slot-item';
            div.textContent = name;
            stripEl.appendChild(div);
        });

        return items.length;
    }

    // ── Запуск ролла ──
    function spin() {
        if (isSpinning) return;
        isSpinning = true;
        btnEl.disabled = true;
        heroDisplay.classList.remove('active');
        heroDisplay.innerHTML = '';

        // Выбор героев
        const winners = [];
        for (let i = 0; i < selectedCount; i++) {
            winners.push(HEROES[Math.floor(Math.random() * HEROES.length)]);
        }

        // Построение полос
        const totalItemsArray = [];
        for (let i = 0; i < selectedCount; i++) {
            const total = buildStrip(`strip-${i}`, winners[i]);
            totalItemsArray.push(total);
        }

        // Анимация
        const duration = 2500;
        const startTime = performance.now();

        function easeOutCubic(t) {
            return 1 - Math.pow(1 - t, 3);
        }

        function animate(now) {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const eased = easeOutCubic(progress);

            for (let i = 0; i < selectedCount; i++) {
                const stripEl = document.getElementById(`strip-${i}`);
                const viewportHeight = stripEl.parentElement.offsetHeight;
                const centerOffset = viewportHeight / 2 - ITEM_HEIGHT / 2;
                const winnerIndex = totalItemsArray[i] - 1;
                const targetY = -(winnerIndex * ITEM_HEIGHT) + centerOffset;
                const currentY = targetY * eased;
                
                stripEl.style.transform = `translateY(${currentY}px)`;
            }

            if (progress < 1) {
                requestAnimationFrame(animate);
            } else {
                // Подсветка
                for (let i = 0; i < selectedCount; i++) {
                    const stripEl = document.getElementById(`strip-${i}`);
                    const itemEls = stripEl.querySelectorAll('.slot-item');
                    const lastItem = itemEls[itemEls.length - 1];
                    if (lastItem) lastItem.classList.add('winner');
                }

                setTimeout(() => {
                    showHeroCards(winners);
                    isSpinning = false;
                    btnEl.disabled = false;
                }, 300);
            }
        }

        requestAnimationFrame(animate);
    }

    // ── Показ карточек с фото 160x217 ──
    function showHeroCards(winners) {
        heroDisplay.innerHTML = '';
        
        winners.forEach((hero, i) => {
            const card = document.createElement('div');
            card.className = 'hero-card';
            card.style.animationDelay = `${i * 0.15}s`;
            
            const filename = HERO_FILENAMES[hero];
            const imageUrl = `images/${filename}.jpg`; 
            
            card.innerHTML = `
                <div class="hero-image-container">
                    <img src="${imageUrl}" 
                         alt="${hero}" 
                         class="hero-image"
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="hero-image-placeholder">🎲</div>
                </div>
                <div class="hero-name">${hero}</div>
                <div class="hero-rarity">✦ summoned ✦</div>
            `;
            
            heroDisplay.appendChild(card);
        });
        
        heroDisplay.classList.add('active');
    }

    // Инициализация
    createSlots(1);

    btnEl.addEventListener('click', spin);

    document.addEventListener('keydown', e => {
        if (e.code === 'Space' || e.code === 'Enter') {
            e.preventDefault();
            spin();
        }
    });
</script>

</body>
</html>
